
name: My First Action

on:
  push:
  pull_request:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install pytest
        run: pip install pytest

      - name: Check hello.py
        run: cat hello.py
        
      - name: Run test
        run: pytest

      - name: Create report
        run: echo "CI test completed successfully" > report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.txt
